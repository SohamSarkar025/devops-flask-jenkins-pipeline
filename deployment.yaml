apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-app
        # Automatically pulls from your specific Docker Hub repository
        image: sohamdocker25/flask-app:latest 
        ports:
        - containerPort: 5000
